# 啟動：docker compose up -d --build
# 看 log：docker compose logs -f app       （或直接看本機的 log/ 資料夾，見下方）
# 停止：docker compose down          （資料會保留在 mysql_data volume）
# 連資料一起刪：docker compose down -v
#
# 需要的設定都在 .env（範本見 .env.example）
#
# 服務 / 容器：
#   app    → first_flaskapi        Flask API（主服務），本機 5001
#   mysql  → first_flaskapi_mysql  MySQL，本機 3307
#
# log 都會寫到本機的 ./log/：
#   log/debug.log、info.log、warning.log、error.log、critical.log   API 依等級分檔
#   log/access.log                                                  每個請求（gunicorn）
#   log/gunicorn.log                                                gunicorn 啟動、worker 狀態
#   log/mysql/error.log                                             MySQL 啟動、警告、錯誤
#   log/mysql/slow.log                                              超過 1 秒的慢查詢

name: first-flaskapi

# docker compose logs 本身也限制大小：每個容器最多 3 個 10 MB 的檔
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------- Flask API（主服務）----------------
  app:
    build: .
    image: first_flaskapi
    container_name: first_flaskapi
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy   # 等 MySQL 真的能連了才啟動
    env_file: .env                   # JWT、郵件等設定
    environment:
      TZ: Asia/Taipei
      LOG_TO_FILE: "1"
      # 1 = 不真的寄信，驗證碼寫進 log/info.log（沒設定 Gmail 或測試時用）
      # 也可以臨時指定：MAIL_SUPPRESS_SEND=1 docker compose up -d
      MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-0}
      # 蓋掉 .env 裡連本機 127.0.0.1 的設定，改連 compose 裡的 mysql 服務
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://${MYSQL_USER:-first_app}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-first}?charset=utf8mb4
    volumes:
      # API 和 gunicorn 的 log 寫回本機的 ./log
      - ./log:/app/log
    ports:
      # 本機用 5001 連（macOS 的 AirPlay 佔用 5000）
      - "${APP_PORT:-5001}:5000"

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.4
    container_name: first_flaskapi_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Taipei
      # 這幾個只在「第一次」建立 volume 時生效，之後改 .env 不會改到已存在的資料庫
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-first}
      MYSQL_USER: ${MYSQL_USER:-first_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?請在 .env 設定 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # log 寫到 /var/log/mysql（掛到本機 ./log/mysql），時間用台灣時間
      - --log-error=/var/log/mysql/error.log
      - --log-timestamps=SYSTEM
      - --slow-query-log=ON
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./log/mysql:/var/log/mysql
    ports:
      # 本機用 3307 連（避開 Homebrew 的 MySQL 3306）
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      # 用 127.0.0.1（走 TCP）：MySQL 初始化期間只開 socket，這樣才不會太早判定成功
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
